<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Huntloop">
  <!--
    Served by Next at /icon.svg from `app/icon.svg`, which also emits the
    <link rel="icon"> tag.

    The Huntloop mark (packages/ui BrandMark) on a tile. A tab bar can be
    light or dark and the favicon cannot know which, so the mark sits on the
    light theme's ink (#0D1422) rather than on nothing: white loop, Meridian
    blue target, legible on either. Literal hex because a served SVG has no
    stylesheet — `var(- -hl-…)` would resolve to nothing. If the path in
    BrandMark.tsx changes, change it here too.

    Created and designed by Chandra Mani Sharma.
  -->
